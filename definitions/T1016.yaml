attack_technique: T1016
display_name: System Network Configuration Discovery
description: >
  Enumerate network interfaces, routes, and reachable hosts from the current
  node to map which internal assets are candidates for scope expansion.
platforms: [linux]
input_arguments:
  target_subnet:
    description: Subnet to sweep for reachable hosts (CIDR)
    type: string
    default: 10.0.0.0/24
executor:
  type: sh
  timeout: 20
  command: |
    ip -brief addr show 2>/dev/null; ip route show 2>/dev/null
