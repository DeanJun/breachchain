attack_technique: T1070.004
display_name: Indicator Removal - File Deletion
description: >
  Remove artifacts left by this run's procedures (e.g. temp files written
  during discovery) to demonstrate cleanup coverage. Optional final step.
platforms: [linux]
input_arguments:
  artifact_path:
    description: Path to the artifact to remove
    type: path
    default: /tmp/breachchain-run-artifact
executor:
  type: sh
  timeout: 10
  command: |
    rm -f #{artifact_path} && echo "removed #{artifact_path}"
