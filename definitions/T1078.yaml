attack_technique: T1078
display_name: Valid Accounts
description: >
  Validate that credentials harvested from the starting node authenticate
  successfully against a remote node, confirming reusable access.
platforms: [linux]
input_arguments:
  remote_user:
    description: Username to validate on the remote node
    type: string
    default: svc-app
executor:
  type: sh
  timeout: 15
  command: |
    whoami && id
