attack_technique: T1087.001
display_name: Account Discovery - Local Account
description: >
  Enumerate local accounts on the current node to confirm foothold context
  and identify candidate usernames for credential reuse.
platforms: [linux]
input_arguments: {}
executor:
  type: sh
  timeout: 10
  command: |
    cut -d: -f1,3,6,7 /etc/passwd
