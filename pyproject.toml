[project]
name = "breachchain"
version = "0.1.0"
description = "Scenario-based penetration test automation: state-driven procedure chaining mapped to MITRE ATT&CK."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
mapping = [
    "mitreattack-python>=5.4",
]

[project.scripts]
breachchain = "breachchain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
